<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMC AI Trader</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>SMC AI Trader</h1>
    <span class="tag">Smart Money Concepts</span>
  </div>
  <div class="controls">
    <input id="symbol" type="text" value="BTC-USD" placeholder="Symbol e.g. BTC-USD" />
    <select id="timeframe">
      <option value="5m">5m</option>
      <option value="15m">15m</option>
      <option value="1h" selected>1h</option>
      <option value="4h">4h</option>
      <option value="1d">1d</option>
    </select>
    <button id="analyze">Analyze</button>
  </div>
</header>

<main>
  <section class="chart-panel">
    <div id="chart"></div>
    <div id="loader" class="loader hidden">Analyzing market structure…</div>
  </section>

  <aside class="side-panel">
    <div class="card signal-card">
      <h2>AI Signal</h2>
      <div id="signal-content">Run an analysis to see signals.</div>
    </div>

    <div class="card">
      <h2>Legend</h2>
      <ul class="legend">
        <li><span class="swatch ob-bull"></span> Bullish Order Block</li>
        <li><span class="swatch ob-bear"></span> Bearish Order Block</li>
        <li><span class="swatch fvg-bull"></span> Bullish FVG</li>
        <li><span class="swatch fvg-bear"></span> Bearish FVG</li>
        <li><span class="swatch bos"></span> BOS / CHoCH</li>
      </ul>
    </div>

    <div class="card">
      <h2>Detected Zones</h2>
      <div class="tabs">
        <button class="tab active" data-tab="obs">OBs</button>
        <button class="tab" data-tab="fvgs">FVGs</button>
        <button class="tab" data-tab="struct">Structure</button>
        <button class="tab" data-tab="liq">Liquidity</button>
      </div>
      <div id="zones-list" class="zones-list"></div>
    </div>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
